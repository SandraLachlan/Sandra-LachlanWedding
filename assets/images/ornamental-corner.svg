<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cornerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D4" />
      <stop offset="35%" stop-color="#E7C986" />
      <stop offset="70%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8C6D32" />
    </linearGradient>
  </defs>
  
  <!-- Outer Corner Angle Lines -->
  <path d="M6 114 L6 6 L114 6" fill="none" stroke="url(#cornerGold)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M14 114 L14 14 L114 14" fill="none" stroke="url(#cornerGold)" stroke-width="1" stroke-dasharray="3,3" opacity="0.8"/>

  <!-- Ornate Corner Blossom -->
  <g transform="translate(14, 14)">
    <!-- Diagonal flourish curve -->
    <path d="M0 0 Q40 5 60 30 Q75 55 95 95" fill="none" stroke="url(#cornerGold)" stroke-width="1.8" />
    
    <!-- Paisley / Mango leaf (Manga motif) -->
    <path d="M6 6 C18 0 35 10 38 24 C40 36 28 46 16 46 C6 46 2 34 8 22 C12 14 14 10 6 6 Z" fill="none" stroke="url(#cornerGold)" stroke-width="1.5" />
    <circle cx="20" cy="24" r="4" fill="url(#cornerGold)" opacity="0.6"/>
    <circle cx="20" cy="24" r="2" fill="#E88B97" />

    <!-- Lotus bud flourish branching off -->
    <path d="M28 8 C38 4 48 10 50 20 C42 18 36 22 28 8 Z" fill="url(#cornerGold)" opacity="0.8" />
    <path d="M8 28 C4 38 10 48 20 50 C18 42 22 36 8 28 Z" fill="url(#cornerGold)" opacity="0.8" />

    <!-- Tendril spirals -->
    <path d="M38 24 Q50 35 48 48 Q46 56 36 54 Q28 52 32 44" fill="none" stroke="url(#cornerGold)" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M24 38 Q35 50 48 48 Q56 46 54 36 Q52 28 44 32" fill="none" stroke="url(#cornerGold)" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Decorative gold pearls / beads -->
    <circle cx="0" cy="0" r="4.5" fill="url(#cornerGold)" />
    <circle cx="0" cy="0" r="2" fill="#FAF7F2" />
    <circle cx="45" cy="4" r="2.2" fill="url(#cornerGold)" />
    <circle cx="4" cy="45" r="2.2" fill="url(#cornerGold)" />
    <circle cx="75" cy="4" r="2" fill="url(#cornerGold)" />
    <circle cx="4" cy="75" r="2" fill="url(#cornerGold)" />
  </g>
</svg>
