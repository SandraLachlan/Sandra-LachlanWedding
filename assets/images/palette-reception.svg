<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160">
  <defs>
    <linearGradient id="recBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="50%" stop-color="#F7F3EE" />
      <stop offset="100%" stop-color="#F2EDE6" />
    </linearGradient>
    <linearGradient id="goldTrimRec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#E7C986" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="416" height="156" rx="10" fill="url(#recBg)" stroke="#C5A059" stroke-width="1.2"/>
  <rect x="7" y="7" width="406" height="146" rx="8" fill="none" stroke="url(#goldTrimRec)" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Title & Icon -->
  <text x="210" y="32" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" font-weight="700" fill="#1B3B2B" text-anchor="middle" letter-spacing="1.5">WEDDING RECEPTION COLOR PALETTE</text>
  <text x="210" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#566E61" text-anchor="middle" letter-spacing="1">ELEGANT EVENING, CHAMPAGNE &amp; HERITAGE SILKS</text>

  <!-- Swatches Group -->
  <g transform="translate(45, 62)">
    <!-- Swatch 1: Royal Midnight Forest -->
    <circle cx="28" cy="28" r="22" fill="#12281D" stroke="#C5A059" stroke-width="1.5" />
    <text x="28" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#1B3B2B" text-anchor="middle">Deep Forest</text>

    <!-- Swatch 2: Elegant Champagne -->
    <circle cx="98" cy="28" r="22" fill="#FDF3E3" stroke="#D1B06E" stroke-width="1.5" />
    <text x="98" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#1B3B2B" text-anchor="middle">Champagne</text>

    <!-- Swatch 3: Antique Gold -->
    <circle cx="168" cy="28" r="22" fill="#C5A059" stroke="#8C6D32" stroke-width="1.5" />
    <text x="168" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#1B3B2B" text-anchor="middle">Antique Gold</text>

    <!-- Swatch 4: Glamorous Rose Wine -->
    <circle cx="238" cy="28" r="22" fill="#9E4953" stroke="#5D1E26" stroke-width="1.5" />
    <text x="238" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#1B3B2B" text-anchor="middle">Rose Wine</text>

    <!-- Swatch 5: Classic Charcoal / Navy -->
    <circle cx="308" cy="28" r="22" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <text x="308" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#1B3B2B" text-anchor="middle">Midnight</text>
  </g>
</svg>
