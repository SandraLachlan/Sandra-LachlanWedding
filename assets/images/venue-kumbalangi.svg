<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="kumbalangiSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBF4F6" />
      <stop offset="60%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#E8E2D8" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7EA391" />
      <stop offset="50%" stop-color="#3D6853" />
      <stop offset="100%" stop-color="#1B3B2B" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="260" fill="url(#kumbalangiSky)" />
  <!-- Water -->
  <rect y="240" width="600" height="160" fill="url(#waterGrad)" />

  <!-- Distant Mangrove / Palm shoreline -->
  <path d="M0 240 Q150 230 300 240 Q450 232 600 240 L600 260 L0 260 Z" fill="#2E533F" />
  
  <!-- Kerala Coconut Palms Silhouette -->
  <g stroke="#1B3B2B" fill="none">
    <path d="M80 240 Q110 160 130 90" stroke-width="4.5"/>
    <path d="M130 90 Q170 80 200 110" stroke-width="2"/>
    <path d="M130 90 Q160 60 180 70" stroke-width="2"/>
    <path d="M130 90 Q110 50 90 70" stroke-width="2"/>
    <path d="M130 90 Q80 70 65 100" stroke-width="2"/>
  </g>

  <!-- Iconic Chinese Fishing Net (Cheenavala) on Kumbalangi Backwaters -->
  <g transform="translate(420, 240)">
    <!-- Base Pier/Stilts -->
    <line x1="-30" y1="0" x2="-30" y2="40" stroke="#12281D" stroke-width="4"/>
    <line x1="30" y1="0" x2="30" y2="40" stroke="#12281D" stroke-width="4"/>
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#12281D" stroke-width="4"/>

    <!-- Cantilevered bamboo beams angling out over water -->
    <line x1="0" y1="0" x2="110" y2="-120" stroke="#12281D" stroke-width="4"/>
    <line x1="-15" y1="0" x2="95" y2="-120" stroke="#12281D" stroke-width="2.5"/>
    
    <!-- Net Spreader arms dipping into water -->
    <path d="M110 -120 Q160 -40 180 15" stroke="#12281D" stroke-width="2.5" fill="none"/>
    <path d="M110 -120 Q130 -30 140 18" stroke="#12281D" stroke-width="2" fill="none"/>
    <path d="M110 -120 Q80 -30 70 20" stroke="#12281D" stroke-width="2" fill="none"/>
    
    <!-- Hanging Net Webbing -->
    <path d="M65 15 Q120 40 185 10" stroke="#C5A059" stroke-width="1.2" stroke-dasharray="3,3" fill="none"/>
    
    <!-- Counterweight rocks / pulleys -->
    <line x1="0" y1="0" x2="-60" y2="-70" stroke="#12281D" stroke-width="3"/>
    <circle cx="-62" cy="-55" r="7" fill="#5A4011" />
    <circle cx="-54" cy="-45" r="6" fill="#5A4011" />
    <line x1="-60" y1="-70" x2="-60" y2="-45" stroke="#12281D" stroke-width="1.5"/>
  </g>

  <!-- Green Nest Kumbalangi Waterfront Mandap Platform -->
  <g transform="translate(180, 210)">
    <!-- Wooden Deck / Lawn -->
    <rect x="-80" y="20" width="160" height="20" rx="3" fill="#8C6D32" stroke="#5A4011" stroke-width="1"/>
    <!-- Canopy with floral garlands -->
    <path d="M-60 20 L-60 -30 L60 -30 L60 20" stroke="#C5A059" stroke-width="2" fill="none"/>
    <path d="M-65 -30 Q0 -45 65 -30" stroke="#E88B97" stroke-width="5" fill="none"/>
    <circle cx="0" cy="-40" r="4" fill="#C5A059" />
  </g>

  <!-- Backwater Ripples & Water Reflections -->
  <ellipse cx="200" cy="270" rx="70" ry="2" fill="#9BB896" opacity="0.5"/>
  <ellipse cx="380" cy="290" rx="90" ry="3" fill="#9BB896" opacity="0.4"/>
  <ellipse cx="250" cy="320" rx="120" ry="3.5" fill="#9BB896" opacity="0.3"/>

  <!-- Venue Badge Overlay -->
  <rect x="20" y="20" width="240" height="42" rx="21" fill="rgba(250, 247, 242, 0.9)" stroke="#C5A059" stroke-width="1"/>
  <text x="140" y="46" font-family="'Cormorant Garamond', serif" font-size="15" font-weight="700" fill="#1B3B2B" text-anchor="middle" letter-spacing="1">GREEN NEST KUMBALANGI</text>
</svg>
