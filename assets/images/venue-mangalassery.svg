<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="pavilionSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF0E6" />
      <stop offset="50%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#EFE8DE" />
    </linearGradient>
    <linearGradient id="terracottaRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BA5D4F" />
      <stop offset="100%" stop-color="#843B2F" />
    </linearGradient>
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9BB896" />
      <stop offset="100%" stop-color="#3D6853" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="250" fill="url(#pavilionSky)" />
  <!-- Manicured Wedding Lawns -->
  <rect y="250" width="600" height="150" fill="url(#lawnGrad)" />

  <!-- Traditional Kerala Heritage Architecture / Grand Pavilion Facade -->
  <g id="pavilion-facade" transform="translate(300, 230)">
    <!-- Base Plinth -->
    <rect x="-240" y="0" width="480" height="25" fill="#D3C7B5" stroke="#8C6D32" stroke-width="1"/>
    
    <!-- Grand Verandah Pillars -->
    <g fill="#FFFDF8" stroke="#8C6D32" stroke-width="1">
      <rect x="-220" y="-100" width="16" height="100" rx="2"/>
      <rect x="-150" y="-100" width="16" height="100" rx="2"/>
      <rect x="-80" y="-100" width="16" height="100" rx="2"/>
      <rect x="-20" y="-100" width="16" height="100" rx="2"/>
      <rect x="40" y="-100" width="16" height="100" rx="2"/>
      <rect x="110" y="-100" width="16" height="100" rx="2"/>
      <rect x="180" y="-100" width="16" height="100" rx="2"/>
    </g>

    <!-- Classical Arches between Pillars -->
    <path d="M-220 -80 Q-185 -100 -150 -80" stroke="#8C6D32" stroke-width="2" fill="none"/>
    <path d="M-150 -80 Q-115 -100 -80 -80" stroke="#8C6D32" stroke-width="2" fill="none"/>
    <path d="M-80 -80 Q-50 -100 -20 -80" stroke="#8C6D32" stroke-width="2" fill="none"/>
    <path d="M-20 -80 Q10 -100 40 -80" stroke="#8C6D32" stroke-width="2" fill="none"/>
    <path d="M40 -80 Q75 -100 110 -80" stroke="#8C6D32" stroke-width="2" fill="none"/>
    <path d="M110 -80 Q145 -100 180 -80" stroke="#8C6D32" stroke-width="2" fill="none"/>

    <!-- Architrave Beam -->
    <rect x="-240" y="-115" width="480" height="15" fill="#8C6D32" />

    <!-- Heritage Sloping Kerala Tile Roof (Koora / Charupady) -->
    <path d="M-260 -115 L-220 -180 L220 -180 L260 -115 Z" fill="url(#terracottaRoof)" stroke="#5A4011" stroke-width="1"/>
    <!-- Roof Gables / Frontal Dormer (Mukhavaram) with Wood Carvings -->
    <polygon points="0,-215 -70,-150 70,-150" fill="url(#terracottaRoof)" stroke="#5A4011" stroke-width="1.5"/>
    <polygon points="0,-205 -55,-155 55,-155" fill="#FFFDF8" stroke="#8C6D32" stroke-width="1"/>
    <!-- Ornamental Brass Finials (Thazhikakkudam) on Roof Ridge -->
    <circle cx="0" cy="-218" r="4" fill="#E7C986" stroke="#8C6D32" stroke-width="0.8"/>
    <circle cx="-220" cy="-182" r="3.5" fill="#E7C986" />
    <circle cx="220" cy="-182" r="3.5" fill="#E7C986" />

    <!-- Floral Arch for Wedding Aisle at Pavilion Entrance -->
    <path d="M-40 25 L-40 -50 C-40 -90 40 -90 40 -50 L40 25" stroke="#E88B97" stroke-width="6" fill="none"/>
    <path d="M-40 -50 C-40 -90 40 -90 40 -50" stroke="#FFFDF8" stroke-width="4" stroke-dasharray="5,4" fill="none"/>
  </g>

  <!-- Venue Badge Overlay -->
  <rect x="20" y="20" width="250" height="42" rx="21" fill="rgba(250, 247, 242, 0.9)" stroke="#C5A059" stroke-width="1"/>
  <text x="145" y="46" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="700" fill="#1B3B2B" text-anchor="middle" letter-spacing="1">MANGALASSERY PAVILION</text>
</svg>
