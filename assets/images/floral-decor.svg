<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bgFloral" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F3ECE4" />
    </linearGradient>
    <linearGradient id="goldArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7C986" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8C6D32" />
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bgFloral)" />

  <!-- Frame border -->
  <rect x="25" y="25" width="550" height="700" rx="16" fill="none" stroke="url(#goldArch)" stroke-width="2" />
  <rect x="35" y="35" width="530" height="680" rx="12" fill="none" stroke="url(#goldArch)" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Floral Mandap Pillars and Canopy -->
  <g id="mandap" transform="translate(300, 360)">
    <!-- Mandap Arch -->
    <path d="M-180 180 L-180 -80 C-180 -180 -80 -220 0 -220 C80 -220 180 -180 180 -80 L180 180" fill="none" stroke="url(#goldArch)" stroke-width="4"/>
    <path d="M-160 180 L-160 -80 C-160 -160 -70 -200 0 -200 C70 -200 160 -160 160 -80 L160 180" fill="none" stroke="url(#goldArch)" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Hanging Floral Torans / Garlands from the Arch -->
    <!-- Swag 1 -->
    <path d="M-180 -80 Q-90 -30 0 -50 Q90 -30 180 -80" stroke="#E88B97" stroke-width="6" stroke-dasharray="8,6" fill="none"/>
    <path d="M-180 -50 Q-90 0 0 -20 Q90 0 180 -50" stroke="#FFFDF7" stroke-width="5" stroke-dasharray="6,5" fill="none"/>
    <path d="M-180 -20 Q-90 30 0 10 Q90 30 180 -20" stroke="#C5A059" stroke-width="4" stroke-dasharray="5,4" fill="none"/>

    <!-- Vertical hanging floral strands (Mullappoo and marigold tassels) -->
    <line x1="-120" y1="-50" x2="-120" y2="80" stroke="#FFFDF8" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="-120" cy="85" r="5" fill="#E88B97" />
    
    <line x1="-60" y1="-30" x2="-60" y2="110" stroke="#FFFDF8" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="-60" cy="115" r="5" fill="#C5A059" />

    <line x1="0" y1="-20" x2="0" y2="130" stroke="#FFFDF8" stroke-width="3.5" stroke-dasharray="6,4"/>
    <circle cx="0" cy="138" r="6" fill="#E88B97" />

    <line x1="60" y1="-30" x2="60" y2="110" stroke="#FFFDF8" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="60" cy="115" r="5" fill="#C5A059" />

    <line x1="120" y1="-50" x2="120" y2="80" stroke="#FFFDF8" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="120" cy="85" r="5" fill="#E88B97" />

    <!-- Center Brass Urli Bowl with floating Lotus and flowers -->
    <ellipse cx="0" cy="150" rx="90" ry="24" fill="url(#goldArch)" stroke="#8C6D32" stroke-width="1.5"/>
    <ellipse cx="0" cy="148" rx="84" ry="18" fill="#1B3B2B" opacity="0.6"/>
    <!-- Water shimmer in Urli -->
    <ellipse cx="0" cy="148" rx="76" ry="14" fill="#3D6853" opacity="0.4"/>
    <!-- Floating Lotuses in Urli -->
    <circle cx="-35" cy="148" r="10" fill="#E88B97" />
    <circle cx="-35" cy="148" r="3" fill="#FFEBB8" />
    <circle cx="0" cy="152" r="14" fill="#E88B97" />
    <circle cx="0" cy="152" r="4" fill="#FFEBB8" />
    <circle cx="35" cy="148" r="10" fill="#E88B97" />
    <circle cx="35" cy="148" r="3" fill="#FFEBB8" />
    <!-- Floating Jasmine petals -->
    <circle cx="-55" cy="146" r="3" fill="#FFFDF8" />
    <circle cx="-16" cy="144" r="2.5" fill="#FFFDF8" />
    <circle cx="20" cy="145" r="3" fill="#FFFDF8" />
    <circle cx="56" cy="147" r="2.5" fill="#FFFDF8" />

    <!-- Left & Right Nilavilakku Lamps at Mandap Base -->
    <g transform="translate(-140, 100) scale(0.28)">
      <ellipse cx="0" cy="160" rx="50" ry="10" fill="#C5A059"/>
      <path d="M-8 160 L-4 50 L4 50 L8 160 Z" fill="#C5A059"/>
      <ellipse cx="0" cy="50" rx="30" ry="8" fill="#E7C986"/>
      <path d="M0 45 C-5 30 -5 20 0 10 C5 20 5 30 0 45 Z" fill="#FF9E2C"/>
      <circle cx="0" cy="18" r="15" fill="#FFE79A" opacity="0.4"/>
    </g>

    <g transform="translate(140, 100) scale(0.28)">
      <ellipse cx="0" cy="160" rx="50" ry="10" fill="#C5A059"/>
      <path d="M-8 160 L-4 50 L4 50 L8 160 Z" fill="#C5A059"/>
      <ellipse cx="0" cy="50" rx="30" ry="8" fill="#E7C986"/>
      <path d="M0 45 C-5 30 -5 20 0 10 C5 20 5 30 0 45 Z" fill="#FF9E2C"/>
      <circle cx="0" cy="18" r="15" fill="#FFE79A" opacity="0.4"/>
    </g>
  </g>

  <!-- Typography Banner -->
  <g transform="translate(300, 630)">
    <text x="0" y="0" font-family="'Cormorant Garamond', serif" font-size="24" font-weight="600" fill="#1B3B2B" text-anchor="middle" letter-spacing="2">FLORAL MANDAP &amp; DÉCOR</text>
    <text x="0" y="24" font-family="'Montserrat', sans-serif" font-size="11" font-weight="500" fill="#8C6D32" text-anchor="middle" letter-spacing="3">JASMINE STRANDS • FRESH LOTUS • BRASS URLIS</text>
  </g>
</svg>
