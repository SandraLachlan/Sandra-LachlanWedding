<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCECEF" />
      <stop offset="35%" stop-color="#F7D6DC" />
      <stop offset="65%" stop-color="#E88B97" />
      <stop offset="85%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#FAF7F2" />
    </linearGradient>

    <linearGradient id="backwaterLake" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F754D" />
      <stop offset="50%" stop-color="#2E533F" />
      <stop offset="100%" stop-color="#1B3B2B" />
    </linearGradient>

    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7C986" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8C6D32" />
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="#FAF7F2" />

  <!-- Frame border -->
  <rect x="25" y="25" width="550" height="700" rx="16" fill="none" stroke="url(#goldFrame)" stroke-width="2" />
  <rect x="35" y="35" width="530" height="680" rx="12" fill="none" stroke="url(#goldFrame)" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Illustration Viewport Arch -->
  <g clip-path="url(#archClip)">
    <clipPath id="archClip">
      <path d="M50 560 L50 200 C50 80 160 50 300 50 C440 50 550 80 550 200 L550 560 Z" />
    </clipPath>

    <!-- Sunset Sky -->
    <rect x="50" y="50" width="500" height="340" fill="url(#sunsetSky)" />

    <!-- Golden Sun setting on Backwaters -->
    <circle cx="300" cy="300" r="55" fill="#FFEBB8" opacity="0.9" />
    <circle cx="300" cy="300" r="75" fill="#FFF3D4" opacity="0.3" />

    <!-- Water Surface -->
    <rect x="50" y="320" width="500" height="250" fill="url(#backwaterLake)" />
    <!-- Sun reflection on water -->
    <ellipse cx="300" cy="340" rx="40" ry="4" fill="#FFEBB8" opacity="0.7"/>
    <ellipse cx="300" cy="360" rx="30" ry="3" fill="#FFEBB8" opacity="0.5"/>
    <ellipse cx="300" cy="380" rx="20" ry="2.5" fill="#FFEBB8" opacity="0.4"/>
    <ellipse cx="300" cy="410" rx="15" ry="2" fill="#FFEBB8" opacity="0.3"/>

    <!-- Silhouetted Coconut Palms along backwater shore -->
    <!-- Left Palm Tree -->
    <path d="M70 340 Q130 240 160 140" stroke="#12281D" stroke-width="6" fill="none"/>
    <g stroke="#12281D" stroke-width="2.5" fill="none">
      <path d="M160 140 Q210 120 250 160" />
      <path d="M160 140 Q190 100 230 110" />
      <path d="M160 140 Q150 90 170 80" />
      <path d="M160 140 Q120 100 100 130" />
      <path d="M160 140 Q110 130 90 165" />
    </g>

    <!-- Right Palm Tree -->
    <path d="M530 340 Q470 230 440 120" stroke="#12281D" stroke-width="7" fill="none"/>
    <g stroke="#12281D" stroke-width="2.5" fill="none">
      <path d="M440 120 Q390 100 350 135" />
      <path d="M440 120 Q410 80 370 90" />
      <path d="M440 120 Q450 70 430 60" />
      <path d="M440 120 Q480 80 500 110" />
      <path d="M440 120 Q490 110 510 145" />
    </g>

    <!-- Traditional Kerala Kettuvallam / Country Boat (Vanchi) with Couple Silhouette -->
    <g transform="translate(300, 350)">
      <!-- Boat hull -->
      <path d="M-80 15 C-40 25 40 25 80 15 C60 5 -60 5 -80 15 Z" fill="#12281D" />
      <path d="M-100 8 C-70 18 -60 18 -50 15" stroke="#12281D" stroke-width="3" fill="none"/>
      <path d="M100 8 C70 18 60 18 50 15" stroke="#12281D" stroke-width="3" fill="none"/>

      <!-- Couple in boat holding hands -->
      <!-- Groom silhouette -->
      <circle cx="12" cy="-10" r="6" fill="#12281D" />
      <path d="M4 -4 C4 -10 20 -10 20 -4 L22 15 L2 15 Z" fill="#12281D" />
      
      <!-- Bride silhouette leaning head on groom -->
      <circle cx="-3" cy="-7" r="5.5" fill="#12281D" />
      <path d="M-12 -2 C-12 -8 6 -8 6 -2 L4 15 L-14 15 Z" fill="#12281D" />
      <!-- Bride's jasmine strand hair -->
      <circle cx="-7" cy="-7" r="1.5" fill="#FFFDF7" />

      <!-- Backwater Ripples -->
      <ellipse cx="0" cy="22" rx="95" ry="3" fill="#3D6853" opacity="0.6"/>
    </g>
  </g>

  <!-- Arch outline re-stroke -->
  <path d="M50 560 L50 200 C50 80 160 50 300 50 C440 50 550 80 550 200 L550 560 Z" fill="none" stroke="url(#goldFrame)" stroke-width="2"/>

  <!-- Typography Banner -->
  <g transform="translate(300, 630)">
    <text x="0" y="0" font-family="'Cormorant Garamond', serif" font-size="24" font-weight="600" fill="#1B3B2B" text-anchor="middle" letter-spacing="2">PRE-WEDDING PORTRAITS</text>
    <text x="0" y="24" font-family="'Montserrat', sans-serif" font-size="11" font-weight="500" fill="#8C6D32" text-anchor="middle" letter-spacing="3">KUMBALANGI SERENADE • BACKWATER GOLD</text>
  </g>
</svg>
