<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160">
  <defs>
    <linearGradient id="hinduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="50%" stop-color="#FFF5F7" />
      <stop offset="100%" stop-color="#F2F8F1" />
    </linearGradient>
    <linearGradient id="goldTrimHW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#E7C986" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="416" height="156" rx="10" fill="url(#hinduBg)" stroke="#C5A059" stroke-width="1.2"/>
  <rect x="7" y="7" width="406" height="146" rx="8" fill="none" stroke="url(#goldTrimHW)" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Title & Icon -->
  <text x="210" y="32" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" font-weight="700" fill="#1B3B2B" text-anchor="middle" letter-spacing="1.5">HINDU WEDDING COLOR PALETTE</text>
  <text x="210" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#DE2A5E" text-anchor="middle" letter-spacing="1">LOTUS BLUSH, PASTEL GREEN &amp; KASAVU GOLD</text>

  <!-- Swatches Group -->
  <g transform="translate(45, 62)">
    <!-- Swatch 1: Lotus Pink -->
    <circle cx="28" cy="28" r="22" fill="#F4457E" stroke="#C2185B" stroke-width="1.5" />
    <text x="28" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#1B3B2B" text-anchor="middle">Lotus Pink</text>

    <!-- Swatch 2: Soft Pastel Pink -->
    <circle cx="98" cy="28" r="22" fill="#FDC2D0" stroke="#F4457E" stroke-width="1.5" />
    <text x="98" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#1B3B2B" text-anchor="middle">Pastel Blush</text>

    <!-- Swatch 3: Pastel Sage Green -->
    <circle cx="168" cy="28" r="22" fill="#B4CEB1" stroke="#5F885B" stroke-width="1.5" />
    <text x="168" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#1B3B2B" text-anchor="middle">Pastel Green</text>

    <!-- Swatch 4: Mint Bud -->
    <circle cx="238" cy="28" r="22" fill="#DCE8DA" stroke="#9BB896" stroke-width="1.5" />
    <text x="238" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#1B3B2B" text-anchor="middle">Soft Mint</text>

    <!-- Swatch 5: Kasavu Gold -->
    <circle cx="308" cy="28" r="22" fill="#F8F3E6" stroke="#C5A059" stroke-width="2.5" />
    <circle cx="308" cy="28" r="16" fill="#E7C986" opacity="0.6"/>
    <text x="308" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#1B3B2B" text-anchor="middle">Kasavu Gold</text>
  </g>
</svg>
