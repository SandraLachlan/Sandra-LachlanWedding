<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <!-- Parrot Feather Gradient (Mint & Forest) -->
    <linearGradient id="parrotFeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9BB896" />
      <stop offset="50%" stop-color="#7E9E7A" />
      <stop offset="100%" stop-color="#3D6853" />
    </linearGradient>

    <!-- Vibrant Pink Lotus Gradient -->
    <linearGradient id="vineLotusPink" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E93B6C" />
      <stop offset="55%" stop-color="#F98CAE" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Gold Vine Gradient -->
    <linearGradient id="vineGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#E7C986" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Curving Botanical Arch Vine (Antique Gold) -->
  <path d="M20 120 Q140 145 250 115 Q360 145 480 120" stroke="url(#vineGold)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M40 125 Q150 155 250 125 Q350 155 460 125" stroke="url(#vineGold)" stroke-width="1" stroke-dasharray="3,3" fill="none" opacity="0.7"/>

  <!-- Left Traditional Kerala Parrot (Facing Center) -->
  <g id="left-parrot" transform="translate(180, 85)">
    <!-- Long Tail Feathers draping down over vine -->
    <path d="M-15 35 Q-25 75 -40 105 Q-25 80 -10 40 Z" fill="#7E9E7A"/>
    <path d="M-10 38 Q-18 80 -30 115 Q-16 80 -6 42 Z" fill="#9BB896"/>

    <!-- Parrot Body -->
    <path d="M-16 8 C-18 -10 -8 -22 6 -20 C18 -18 20 -5 18 10 C14 28 0 38 -15 35 Z" fill="url(#parrotFeather)"/>
    
    <!-- Wing with Gold Trim -->
    <path d="M-8 0 C-4 -12 10 -10 14 5 C10 20 -2 26 -8 18 Z" fill="#B4CEB1" stroke="url(#vineGold)" stroke-width="1"/>

    <!-- Curved Vibrant Pink Beak -->
    <path d="M16 -16 C22 -16 26 -10 24 -4 C22 -2 18 -6 14 -10 Z" fill="#E93B6C"/>
    
    <!-- Eye with Ring -->
    <circle cx="10" cy="-14" r="2.8" fill="#FFFDF8" stroke="url(#vineGold)" stroke-width="0.7"/>
    <circle cx="10" cy="-14" r="1.3" fill="#1B3B2B"/>

    <!-- Traditional Gold Kasavu Collar Ring around neck -->
    <path d="M2 -8 Q10 -5 14 -12" stroke="url(#vineGold)" stroke-width="1.8" fill="none"/>
  </g>

  <!-- Right Traditional Kerala Parrot (Facing Center) -->
  <g id="right-parrot" transform="translate(320, 85)">
    <!-- Long Tail Feathers -->
    <path d="M15 35 Q25 75 40 105 Q25 80 10 40 Z" fill="#7E9E7A"/>
    <path d="M10 38 Q18 80 30 115 Q16 80 6 42 Z" fill="#9BB896"/>

    <!-- Parrot Body -->
    <path d="M16 8 C18 -10 8 -22 -6 -20 C-18 -18 -20 -5 -18 10 C-14 28 0 38 15 35 Z" fill="url(#parrotFeather)"/>
    
    <!-- Wing with Gold Trim -->
    <path d="M8 0 C4 -12 -10 -10 -14 5 C-10 20 2 26 8 18 Z" fill="#B4CEB1" stroke="url(#vineGold)" stroke-width="1"/>

    <!-- Curved Vibrant Pink Beak -->
    <path d="M-16 -16 C-22 -16 -26 -10 -24 -4 C-22 -2 -18 -6 -14 -10 Z" fill="#E93B6C"/>
    
    <!-- Eye with Ring -->
    <circle cx="-10" cy="-14" r="2.8" fill="#FFFDF8" stroke="url(#vineGold)" stroke-width="0.7"/>
    <circle cx="-10" cy="-14" r="1.3" fill="#1B3B2B"/>

    <!-- Traditional Gold Kasavu Collar Ring -->
    <path d="M-2 -8 Q-10 -5 -14 -12" stroke="url(#vineGold)" stroke-width="1.8" fill="none"/>
  </g>

  <!-- Center Blooming Vibrant Pink Lotus Crest -->
  <g id="center-crest" transform="translate(250, 105)">
    <!-- Center Upright Lotus Blossom -->
    <path d="M0 10 C-12 10 -24 0 -22 -14 C-10 -6 0 0 0 10 Z" fill="#E93B6C" opacity="0.85"/>
    <path d="M0 10 C12 10 24 0 22 -14 C10 -6 0 0 0 10 Z" fill="#E93B6C" opacity="0.85"/>
    
    <path d="M0 12 C-14 4 -16 -18 -8 -26 C-2 -12 0 2 0 12 Z" fill="url(#vineLotusPink)"/>
    <path d="M0 12 C14 4 16 -18 8 -26 C2 -12 0 2 0 12 Z" fill="url(#vineLotusPink)"/>
    
    <path d="M0 12 C-6 -2 -6 -28 0 -36 C6 -28 6 -2 0 12 Z" fill="url(#vineLotusPink)"/>
    
    <!-- Core & Gold Pearl -->
    <circle cx="0" cy="-2" r="3.5" fill="url(#vineGold)"/>
    <circle cx="0" cy="-2" r="1.5" fill="#C2185B"/>
  </g>

  <!-- Jasmine Buds & Tendrils along the vine in Vibrant Pink & Mint -->
  <g fill="#FFFDF8" stroke="#FDC2D0" stroke-width="0.8">
    <circle cx="80" cy="122" r="4.5" />
    <circle cx="120" cy="132" r="5" />
    <circle cx="380" cy="132" r="5" />
    <circle cx="420" cy="122" r="4.5" />
    <!-- Vibrant Pink bud tips -->
    <circle cx="80" cy="122" r="1.8" fill="#E93B6C" />
    <circle cx="120" cy="132" r="2" fill="#E93B6C" />
    <circle cx="380" cy="132" r="2" fill="#E93B6C" />
    <circle cx="420" cy="122" r="1.8" fill="#E93B6C" />
  </g>
</svg>
