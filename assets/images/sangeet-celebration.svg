<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="sangeetBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="50%" stop-color="#FEF5E7" />
      <stop offset="100%" stop-color="#FBE6C6" />
    </linearGradient>
    <linearGradient id="marigoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="50%" stop-color="#F4A261" />
      <stop offset="100%" stop-color="#E76F51" />
    </linearGradient>
    <linearGradient id="goldBorderSangeet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7C986" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8C6D32" />
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#sangeetBg)" />
  <rect x="25" y="25" width="550" height="700" rx="16" fill="none" stroke="url(#goldBorderSangeet)" stroke-width="2" />
  <rect x="35" y="35" width="530" height="680" rx="12" fill="none" stroke="url(#goldBorderSangeet)" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Festive Marigold & Lantern Hangings -->
  <g id="decor" transform="translate(300, 360)">
    <!-- Marigold String Swags -->
    <path d="M-220 -200 Q-110 -150 0 -170 Q110 -150 220 -200" stroke="url(#marigoldGrad)" stroke-width="8" stroke-dasharray="8,6" fill="none"/>
    <path d="M-220 -170 Q-110 -110 0 -130 Q110 -110 220 -170" stroke="#FFD166" stroke-width="6" stroke-dasharray="7,5" fill="none"/>
    
    <!-- Haldi Turmeric Urli in Center with flowers -->
    <ellipse cx="0" cy="140" rx="110" ry="28" fill="url(#goldBorderSangeet)" stroke="#8C6D32" stroke-width="2"/>
    <ellipse cx="0" cy="136" rx="100" ry="20" fill="#ECA72C" />
    <!-- Yellow Turmeric Paste Paste Glow -->
    <ellipse cx="0" cy="136" rx="90" ry="16" fill="#F4B942" />
    <circle cx="-40" cy="136" r="10" fill="#E76F51" />
    <circle cx="0" cy="138" r="12" fill="#E76F51" />
    <circle cx="40" cy="136" r="10" fill="#E76F51" />

    <!-- Indian Dhol Drum (Sangeet Rhythm) -->
    <g transform="translate(0, -20) scale(1.1)">
      <!-- Drum barrel -->
      <path d="M-60 -30 C-30 -40 30 -40 60 -30 L60 30 C30 40 -30 40 -60 30 Z" fill="#8C6D32" stroke="#5A4011" stroke-width="2"/>
      <!-- Drum heads -->
      <ellipse cx="-60" cy="0" rx="10" ry="30" fill="#EDE4D5" stroke="#5A4011" stroke-width="2"/>
      <ellipse cx="60" cy="0" rx="10" ry="30" fill="#EDE4D5" stroke="#5A4011" stroke-width="2"/>
      <!-- Ropes / Zari criss-cross -->
      <line x1="-55" y1="-28" x2="-20" y2="35" stroke="#FFF3D4" stroke-width="1.8"/>
      <line x1="-20" y1="35" x2="15" y2="-37" stroke="#FFF3D4" stroke-width="1.8"/>
      <line x1="15" y1="-37" x2="55" y2="28" stroke="#FFF3D4" stroke-width="1.8"/>
      <line x1="-55" y1="28" x2="-20" y2="-35" stroke="#FFF3D4" stroke-width="1.8"/>
      <line x1="-20" y1="-35" x2="15" y2="37" stroke="#FFF3D4" stroke-width="1.8"/>
      <line x1="15" y1="37" x2="55" y2="-28" stroke="#FFF3D4" stroke-width="1.8"/>
      <!-- Brass tuning rings -->
      <circle cx="-2" cy="0" r="3" fill="#E7C986" />
      <circle cx="33" cy="0" r="3" fill="#E7C986" />
      <circle cx="-37" cy="0" r="3" fill="#E7C986" />
    </g>

    <!-- Festive sparkle stars & floral bursts -->
    <g fill="#F4B942">
      <circle cx="-130" cy="-60" r="4" /><circle cx="-160" cy="20" r="5" />
      <circle cx="130" cy="-60" r="4" /><circle cx="160" cy="20" r="5" />
      <circle cx="-90" cy="60" r="3" /><circle cx="90" cy="60" r="3" />
    </g>
  </g>

  <!-- Typography Banner -->
  <g transform="translate(300, 630)">
    <text x="0" y="0" font-family="'Cormorant Garamond', serif" font-size="24" font-weight="600" fill="#1B3B2B" text-anchor="middle" letter-spacing="2">HALDI &amp; SANGEET CELEBRATION</text>
    <text x="0" y="24" font-family="'Montserrat', sans-serif" font-size="11" font-weight="500" fill="#8C6D32" text-anchor="middle" letter-spacing="3">RHYTHM OF DHOL • TURMERIC BLESSINGS</text>
  </g>
</svg>
