<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="50%" stop-color="#F4EFEB" />
      <stop offset="100%" stop-color="#EBE3DA" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7C986" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8C6D32" />
    </linearGradient>

    <linearGradient id="roseGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F7D6DC" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#FAF7F2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FAF7F2" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Soft Rose Halo -->
  <circle cx="400" cy="420" r="280" fill="url(#roseGlow)" />

  <!-- Traditional Arch Frame -->
  <path d="M120 900 L120 420 C120 230 250 120 400 120 C550 120 680 230 680 420 L680 900 Z" fill="none" stroke="url(#goldBorder)" stroke-width="3" />
  <path d="M136 890 L136 425 C136 245 260 140 400 140 C540 140 664 245 664 425 L664 890 Z" fill="none" stroke="url(#goldBorder)" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.85"/>

  <!-- Top Arch Finial / Lotus Crest -->
  <g transform="translate(400, 100) scale(0.65)">
    <path d="M0 -30 C-20 0 -20 20 0 30 C20 20 20 0 0 -30 Z" fill="#E88B97" />
    <path d="M-15 0 C-30 15 -20 30 0 30 C-10 15 -10 5 -15 0 Z" fill="#C46D77" />
    <path d="M15 0 C30 15 20 30 0 30 C10 15 10 5 15 0 Z" fill="#C46D77" />
    <circle cx="0" cy="36" r="4" fill="#C5A059" />
  </g>

  <!-- Romantic Couple Silhouette / Artistic Illustration -->
  <g transform="translate(400, 480)" filter="url(#softGlow)">
    <!-- Groom Silhouette (Lachlan) - right/left partner in elegant sherwani / suit -->
    <path d="M-30 -140 C-10 -150 30 -150 45 -130 C60 -115 65 -80 60 -50 C80 -30 110 20 120 110 C125 150 130 240 130 320 L-10 320 C-15 250 -20 180 -25 100 C-30 70 -35 40 -40 20 C-45 -20 -40 -110 -30 -140 Z" fill="#1B3B2B" opacity="0.88"/>
    
    <!-- Bride Silhouette (Sandra) - leaning in gracefully with Kerala bridal dupatta & jasmine hair adornment -->
    <path d="M-60 -110 C-40 -145 0 -135 15 -100 C-5 -90 -10 -60 5 -40 C-15 -20 -45 10 -65 60 C-85 110 -105 190 -115 320 L10 320 C5 220 5 140 -5 70 C-10 30 -25 -20 -35 -50 C-45 -70 -55 -90 -60 -110 Z" fill="#C46D77" opacity="0.85"/>

    <!-- Traditional Gold Kasavu Border Accents on Silhouette -->
    <path d="M-65 60 C-75 140 -85 220 -90 320" stroke="url(#goldBorder)" stroke-width="2.5" fill="none" opacity="0.75"/>
    <path d="M-62 60 C-72 140 -82 220 -87 320" stroke="url(#goldBorder)" stroke-width="1" stroke-dasharray="2,3" fill="none" opacity="0.6"/>

    <!-- Bride's Jasmine Garland / Headpiece Glow -->
    <g fill="#FFFDF7">
      <circle cx="-50" cy="-115" r="4" />
      <circle cx="-42" cy="-122" r="4.5" />
      <circle cx="-32" cy="-125" r="4" />
      <circle cx="-22" cy="-122" r="3.5" />
      <circle cx="-56" cy="-105" r="3.5" />
      <circle cx="-60" cy="-94" r="3" />
      <circle cx="-62" cy="-82" r="2.8" />
    </g>

    <!-- Couple's Intertwined Floral Varmala / Garland -->
    <path d="M-40 40 C-20 80 0 100 20 110 C40 100 50 70 45 40" stroke="url(#goldBorder)" stroke-width="4" stroke-dasharray="6,4" fill="none" />
    <circle cx="-10" cy="90" r="5" fill="#E88B97" />
    <circle cx="0" cy="98" r="6" fill="#FFFDF7" />
    <circle cx="12" cy="95" r="5" fill="#E88B97" />
  </g>

  <!-- Surrounding Botanical Lotus & Jasmine Wreath (Base) -->
  <g transform="translate(400, 830)">
    <!-- Base Lotus -->
    <path d="M0 0 C-35 -20 -40 -60 0 -80 C40 -60 35 -20 0 0 Z" fill="#E88B97" opacity="0.9" />
    <path d="M-20 -10 C-50 -30 -40 -65 0 -80 C-15 -50 -15 -30 -20 -10 Z" fill="#C46D77" />
    <path d="M20 -10 C50 -30 40 -65 0 -80 C15 -50 15 -30 20 -10 Z" fill="#C46D77" />
    <circle cx="0" cy="-35" r="5" fill="#C5A059" />

    <!-- Supporting Pista Green Leaves -->
    <path d="M-50 10 C-120 -10 -150 -40 -180 -10 C-140 15 -80 20 -50 10 Z" fill="#9BB896" opacity="0.8"/>
    <path d="M50 10 C120 -10 150 -40 180 -10 C140 15 80 20 50 10 Z" fill="#9BB896" opacity="0.8"/>
  </g>

  <!-- Elegant Typographic Overlay Plaque -->
  <g transform="translate(400, 880)">
    <rect x="-180" y="-30" width="360" height="60" rx="30" fill="#FAF7F2" stroke="url(#goldBorder)" stroke-width="1.5" />
    <text x="0" y="-2" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="600" fill="#1B3B2B" text-anchor="middle" letter-spacing="2">SANDRA &amp; LACHLAN</text>
    <text x="0" y="18" font-family="'Montserrat', sans-serif" font-size="10" font-weight="500" fill="#8C6D32" text-anchor="middle" letter-spacing="3">FEBRUARY 2027 • KERALA</text>
  </g>
</svg>
